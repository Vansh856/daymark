services:
  - type: web
    name: daymark
    runtime: python
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daymark-db
          property: connectionString
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

databases:
  - name: daymark-db
    plan: basic-256mb
